[project]
name = "compositor-ai"
version = "1.0.0"
description = "The Python environment Compositor's AI helper builds with uv to run Qwen-Image-2.1."
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.0",
    "transformers==5.17.0",
    # Qwen-Image-2.1 support (QwenImage21Pipeline) is not in a diffusers release yet. An archive URL rather than a
    # git URL, so installing doesn't need git, which a Mac only has with Xcode's tools.
    "diffusers @ https://github.com/huggingface/diffusers/archive/80c7ed262aeffbeb43ef13ae04baeb9b84515a69.zip",
    "accelerate",
    "huggingface_hub[hf_xet]",
    "pillow",
    "torchvision",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
